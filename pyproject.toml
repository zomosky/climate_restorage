[project]
name = "climate_restore"
version = "0.1.0"
description = "climate_pipeline restore sub-project: crop + time-concat downloaded NWP GRIB into NetCDF/Zarr"
authors = [
    { name = "zomosky", email = "55118579+zomosky@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cfgrib>=0.9.15.1",
    "eccodeslib>=2.46.2.19",
    "netcdf4>=1.7.4",
    "numcodecs>=0.16.5",
    "numpy>=2.4.4",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "tqdm>=4.67.3",
    "xarray>=2026.4.0",
    "zarr>=3.1.6",
]

[project.scripts]
climate_restore = "climate_restore.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
